name: Daily source health check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-health
  cancel-in-progress: false

jobs:
  record-health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Choose the daily rotating hour (Asia/Kolkata)
        id: timing
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta, timezone
          from hashlib import sha256
          import os

          now = datetime.now(timezone(timedelta(hours=5, minutes=30)))
          day = now.date().isoformat()
          selected_hour = sha256((os.environ["REPOSITORY"] + ":" + day).encode()).digest()[0] % 24
          due = os.environ["EVENT_NAME"] == "workflow_dispatch" or now.hour >= selected_hour
          print(f"day={day}")
          print(f"hour={selected_hour}")
          print(f"due={'true' if due else 'false'}")
          PY

      - name: Run checks and write dated report
        if: steps.timing.outputs.due == 'true'
        run: python .github/scripts/record_daily_health.py --date "${{ steps.timing.outputs.day }}"

      - name: Commit today's report directly to main
        if: steps.timing.outputs.due == 'true'
        env:
          DAY: ${{ steps.timing.outputs.day }}
        shell: bash
        run: |
          report="docs/daily_checks/$DAY.md"
          if [ ! -f "$report" ]; then
            echo "Expected report was not generated"
            exit 1
          fi
          if git ls-files --error-unmatch "$report" >/dev/null 2>&1; then
            echo "Today's report is already committed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$report"
          if git diff --cached --quiet; then
            echo "No new report to commit"
            exit 0
          fi
          git commit -m "chore: record repository checks for $DAY"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Mark failed or missing checks as a failed workflow
        if: steps.timing.outputs.due == 'true'
        env:
          DAY: ${{ steps.timing.outputs.day }}
        shell: bash
        run: |
          report="docs/daily_checks/$DAY.md"
          if grep -Fq '| **FAIL** |' "$report" || grep -Fq '| **NOT RUN** |' "$report"; then
            echo "::error::Repository checks failed or did not run. Review $report."
            exit 1
          fi
          echo "All repository checks passed."
